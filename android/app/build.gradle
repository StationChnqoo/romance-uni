plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'cn.xiaopacai.romance'
    compileSdk 35

    defaultConfig {
        applicationId "cn.xiaopacai.romance"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    splits {
        abi {
            enable true  // 启用按ABI拆分
            reset() // 重置默认列表
            // 明确指定需要分发的架构
            // 注意：必须包含 'x86'。x86 模拟器（32 位）只带 libndk_translation 翻译层，
            // 装 armeabi-v7a 的包会因为 V8 走 ARM 翻译而初始化失败 → JS 引擎起不来 → 白屏
            // （日志特征：WeexCore spinWaitPeer timeout / invokeInitFramework ExecuteJavaScript fail）。
            // aar 里本来就有 x86 的 so，带上它不产生额外下载，只影响 x86 包的体积。
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk false // 不生成包含所有架构的“通用APK”，可以进一步减小体积
        }
    }

    signingConfigs {
        release {
            storeFile file('test.keystore')
            storePassword '123456'
            keyAlias 'testalias'
            keyPassword '123456'
        }
    }

    //此处配置必须添加 否则无法正确运行
    aaptOptions {
        additionalParameters '--auto-add-overlay'
        //noCompress 'foo', 'bar'
        ignoreAssetsPattern "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-uniapp.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        compose true
    }
    
    packagingOptions {
        exclude 'META-INF/proguard/androidx-*.pro'
        pickFirst 'META-INF/androidx.*.version'
        jniLibs {
            useLegacyPackaging true
        }
    }
}

configurations.all {
    exclude group: 'com.android.support'
}

dependencies {
    // Uni -->
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.6.0'
    implementation "androidx.fragment:fragment:1.1.0"
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation "com.facebook.fresco:fresco:3.4.0"
    implementation "com.facebook.fresco:middleware:3.4.0"
    implementation "com.facebook.fresco:animated-gif:3.4.0"
    implementation "com.facebook.fresco:webpsupport:3.4.0"
    implementation "com.facebook.fresco:animated-webp:3.4.0"
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation "net.lingala.zip4j:zip4j:2.11.5"
    // <--
    // 添加 Glide 图片加载库（修复 TabBar 图标不显示）
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.androidx.compose.ui.test.junit4
    debugImplementation libs.androidx.compose.ui.tooling
    debugImplementation libs.androidx.compose.ui.test.manifest
}